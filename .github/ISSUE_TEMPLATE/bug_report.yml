name: Bug report
description: Something in the kit fails or behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or prompt
      description: The exact command you ran (or what you asked Claude), and the full error output.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, chip (Intel or Apple Silicon), Docker version, and the scraper image tag.
      placeholder: macOS 15, Apple Silicon, Docker 28.1, gosom/google-maps-scraper:v1.18.1
    validations:
      required: true
