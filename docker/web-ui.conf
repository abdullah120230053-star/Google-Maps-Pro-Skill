# Keep the upstream engine intact; customize only the PRO repository's star link.
server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location / {
        proxy_pass http://google-maps-scraper:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_buffering off;

        # Default sub_filter content type is text/html; API/CSV responses pass through.
        sub_filter 'href="https://github.com/gosom/google-maps-scraper" class="github-button"'
                   'href="https://github.com/abdullah120230053-star/Google-Maps-Pro-Skill" class="github-button"';
        sub_filter_once off;
    }
}
