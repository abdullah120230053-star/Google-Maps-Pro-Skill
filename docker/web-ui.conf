# Keep the upstream engine intact; serve local API docs and PRO support links.
server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location = / {
        root /usr/share/nginx/html/pro-ui;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location /ui/ {
        alias /usr/share/nginx/html/pro-ui/;
        add_header Cache-Control "no-cache";
    }

    location = /api/docs {
        alias /usr/share/nginx/html/pro-api/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /api/docs/ {
        return 302 /api/docs;
    }

    location = /api/openapi.json {
        alias /usr/share/nginx/html/pro-api/openapi.json;
        default_type application/json;
    }

    location / {
        proxy_pass http://google-maps-scraper:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_buffering off;

        # Default sub_filter content type is text/html; API/CSV responses pass through.
        sub_filter 'href="https://github.com/gosom/google-maps-scraper" class="github-button"'
                   'href="https://github.com/abdullah120230053-star/Google-Maps-Pro-Skill" class="github-button"';
        sub_filter_once off;
        sub_filter 'href="https://github.com/sponsors/gosom"'
                   'href="https://github.com/abdullah120230053-star/Google-Maps-Pro-Skill"';
        sub_filter 'Sponsor on GitHub' 'Support on GitHub';
        sub_filter 'by becoming a sponsor' 'through the PRO repository';
    }
}
